name: job concurrency

on: 
 workflow_dispatch:

jobs:
 first_job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v4

            - name: list files
              run:  ls -ltra

            - name: run shell script
              run:
                |
                chmod +x script.sh
                ./script.sh
 deploy:
  timeout-minutes: 1
  needs: first_job
  concurrency:
   group: prod-deploy
   cancel-in-progress: true
  runs-on: ubuntu-latest
  steps:
  - name: x1
    timeout-minutes: 1
    run:
     |
     echo docker
     sleep 6000
